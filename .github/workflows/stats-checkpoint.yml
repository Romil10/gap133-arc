name: Refresh stats checkpoint
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev
      - run: node scripts/update-checkpoint.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet lib/stats-checkpoint.mjs; then echo "no change"; exit 0; fi
          git config user.name "gap133-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/stats-checkpoint.mjs
          git commit -m "Refresh stats checkpoint"
          git push
